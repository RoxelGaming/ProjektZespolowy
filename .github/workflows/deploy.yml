name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 📦 Instalacja zależności
        run: cd projekt-zespolowy-tiket-bot && npm install

      - name: 🔨 Budowanie projektu
        run: cd projekt-zespolowy-tiket-bot && npm run build

      - name: 🔄 Przygotowanie triggera restartu dla cPanelu
        run: |
          cd projekt-zespolowy-tiket-bot
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🧹 Usunięcie ciężkich plików (Naprawia błąd Timeout/EOF)
        run: |
          cd projekt-zespolowy-tiket-bot
          # Usuwamy absolutnie wszystkie śmieci z kompilacji
          rm -rf .next/cache
          rm -rf .next/turbopack
          rm -f .next/trace
          rm -f .next/trace-build
          # Usuwamy pliki systemowe/zbędne
          rm -rf node_modules
          rm -rf .git
          rm -f .env.example
          rm -f README.md

      - name: 🚀 Wdrażanie na serwer Krystal (FTPS z wydłużonym czasem)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./projekt-zespolowy-tiket-bot/
          # Używamy "./", zakładając, że używasz tego dedykowanego, ograniczonego konta FTP
          server-dir: ./
          # Wydłużamy limit czasu oczekiwania na odpowiedź serwera do 10 minut (600000 ms)
          timeout: 600000