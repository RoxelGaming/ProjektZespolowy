name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./projekt-zespolowy-tiket-bot

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: projekt-zespolowy-tiket-bot/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('projekt-zespolowy-tiket-bot/package-lock.json') }}

      - name: 📦 Instalacja zależności (Czysta)
        run: npm ci

      - name: 🔨 Budowanie projektu
        run: npm run build

      - name: ✂️ Odchudzanie node_modules (Tylko pliki produkcyjne)
        run: npm prune --omit=dev

      - name: 🧹 Optymalizacja i kompresja do jednego pliku (Omija blokady SFTP!)
        run: |
          rm -rf .next/cache
          rm -rf .next/turbopack
          rm -f .next/trace
          rm -f .next/trace-build
          rm -rf ../.git
          rm -f .env.example
          rm -f README.md
          
          # Tworzymy JEDEN plik paczki (deploy.tar.gz) katalog wyżej
          # Dzięki temu transfer potrwa ułamek sekundy i nie wywali błędu!
          tar -czf ../deploy.tar.gz -C . .

      - name: 🚀 Wdrażanie na serwer Krystal (SFTP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 722 # KLUCZOWE: Ustawienie prawidłowego portu Krystal dla SFTP
          source: "deploy.tar.gz"
          target: "/home/xdekhckr/projektzespolowy_app/"

      - name: 🤖 Rozpakowanie, NPM Install i Restart na serwerze cPanel (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 722 # KLUCZOWE: Ustawienie prawidłowego portu Krystal dla SSH
          script: |
            cd /home/xdekhckr/projektzespolowy_app
            
            # 1. Rozpakowanie paczki na serwerze (błyskawicznie nadpisuje stare pliki)
            tar -xzf deploy.tar.gz
            
            # 2. Usunięcie paczki po udanym rozpakowaniu, by nie śmiecić na dysku
            rm deploy.tar.gz
            
            # 3. Instalacja modułów na serwerze Krystal i restart aplikacji
            /home/xdekhckr/nodevenv/projektzespolowy_app/24/bin/npm install
            mkdir -p tmp
            touch tmp/restart.txt
