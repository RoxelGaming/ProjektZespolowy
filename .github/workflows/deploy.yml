name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 📦 Instalacja zależności
        run: cd projekt-zespolowy-tiket-bot && npm install

      - name: 🔨 Budowanie projektu
        run: cd projekt-zespolowy-tiket-bot && npm run build

      - name: 🔄 Przygotowanie triggera restartu dla cPanelu
        run: |
          cd projekt-zespolowy-tiket-bot
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🧹 Usunięcie ciężkich plików (Naprawia błąd Timeout/EOF)
        run: |
          cd projekt-zespolowy-tiket-bot
          rm -rf .next/cache
          rm -rf node_modules
          rm -rf .git
          rm -f .env.example
          rm -f README.md

      - name: 🚀 Wdrażanie na serwer Krystal (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Wskazujemy lokalny folder z aplikacją (zwróć uwagę na ukośnik na końcu)
          local-dir: ./projekt-zespolowy-tiket-bot/
          # Jeśli Twoje konto FTP w cPanelu jest ograniczone TYLKO do folderu aplikacji, użyj "./"
          # Jeśli konto ma dostęp do całego serwera, zmień to na np. "projektzespolowy_app/"
          server-dir: ./