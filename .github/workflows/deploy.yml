name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 📦 Instalacja zależności
        run: cd projekt-zespolowy-tiket-bot && npm install

      - name: 🔨 Budowanie projektu
        run: cd projekt-zespolowy-tiket-bot && npm run build

      - name: 🔄 Przygotowanie triggera restartu dla cPanelu
        run: |
          cd projekt-zespolowy-tiket-bot
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🧹 Usunięcie plików ignorowanych (zastępuje dawne exclude)
        run: |
          cd projekt-zespolowy-tiket-bot
          rm -rf .next/cache
          rm -rf node_modules
          rm -rf .git
          rm -f .env.example
          rm -f README.md

      - name: 🚀 Wdrażanie na serwer Krystal (SFTP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 722
          source: "projekt-zespolowy-tiket-bot"
          target: "/home/xdekhckr/projektzespolowy_app"
          strip_components: 1