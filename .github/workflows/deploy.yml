name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 📦 Instalacja zależności
        # Zmienione: Najpierw wchodzimy do folderu aplikacji
        run: cd projekt-zespolowy-tiket-bot && npm install

      - name: 🔨 Budowanie projektu
        run: cd projekt-zespolowy-tiket-bot && npm run build

      - name: 🔄 Przygotowanie triggera restartu dla cPanelu
        run: |
          cd projekt-zespolowy-tiket-bot
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🚀 Wdrażanie na serwer FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          # Zmienione: Wskazujemy konkretny folder z aplikacją do wysłania
          local-dir: ./projekt-zespolowy-tiket-bot/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            README.md