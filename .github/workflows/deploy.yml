name: Deploy to cPanel

on:
  push:
    branches:
      - main 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./projekt-zespolowy-tiket-bot

    steps:
      - name: 🚚 Pobranie kodu
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: projekt-zespolowy-tiket-bot/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('projekt-zespolowy-tiket-bot/package-lock.json') }}

      - name: 📦 Instalacja zależności
        run: npm install

      - name: 🔨 Budowanie projektu
        run: npm run build

      - name: 🧹 Optymalizacja i przygotowanie pliku restartu
        run: |
          rm -rf .next/cache
          rm -rf .next/turbopack
          rm -f .next/trace
          rm -f .next/trace-build
          rm -rf ../.git
          rm -f .env.example
          rm -f README.md
          # Tworzymy magiczny plik restartu LOKALNIE w GitHubie
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🚀 Wdrażanie na serwer Krystal (FTPS z limitem połączeń)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          concurrency: 5
          local-dir: ./projekt-zespolowy-tiket-bot/
          server-dir: ./projektzespolowy_app/
          timeout: 600000