name: Deploy to cPanel

on:
  push:
    branches:
      - main # Akcja uruchamia się tylko przy pushu na główną gałąź

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Pobranie kodu (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Ta sama wersja, której używamy w cPanelu

      - name: 📦 Instalacja zależności
        run: npm install

      - name: 🔨 Budowanie projektu (Next.js & TypeScript)
        run: npm run build

      - name: 🔄 Przygotowanie triggera restartu dla cPanelu
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: 🚀 Wdrażanie na serwer (FTP Deploy)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env.example
            README.md
            .gitignore